services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      DEEPSTONE_SECRET: ${DEEPSTONE_SECRET:-change-me-in-production}
      DEEPSTONE_DB_URL: sqlite+aiosqlite:////data/deepstone.db
      DEEPSTONE_ADMIN_USER: ${DEEPSTONE_ADMIN_USER:-admin}
      DEEPSTONE_ADMIN_PASS: ${DEEPSTONE_ADMIN_PASS:-}
      CARDS_JSON_PATH: /srv/backend/cards.json
      FRONTEND_DIST_DIR: /srv/frontend/dist
    volumes:
      # Persistent DB (named volume)
      - deepstone-data:/data
      # Private assets + SPA build (gitignored / host-built) — bind mounts so
      # they aren't baked into the image.
      - ../backend/images:/srv/backend/images
      - ../backend/audio:/srv/backend/audio
      - ../frontend/dist:/srv/frontend/dist
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  deepstone-data:
